[project]
name = "docker-clennear"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.4"
dependencies = [
    "pytest>=9.0.1",
    "rich>=14.2.0",
    "textual>=6.6.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-textual-snapshot>=1.0.0",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["cli", "docker_cleaner", "lmarena"]
