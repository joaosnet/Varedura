[project]
name = "varedura"
version = "1.0.0"
description = "Cross-platform Docker cleanup toolkit & network monitor"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "psutil>=7.2.1",
    "pytest>=9.0.1",
    "rich>=14.2.0",
    "plotext>=5.3.2",
    "matplotlib>=3.10.0",
    "speedtest-cli>=2.1.3",
    "flask>=3.1.2",
    "scapy>=2.7.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "selenium>=4.39.0",
    "reportlab>=4.4.7",
    "pypdf2>=3.0.1",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["cli", "docker_cleaner", "monitor"]
