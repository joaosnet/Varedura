[project]
name = "docker-clennear"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "psutil>=7.2.1",
    "pytest>=9.0.1",
    "rich>=14.2.0",
    "plotext>=5.3.2",
    "matplotlib>=3.10.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["cli", "docker_cleaner", "lmarena", "monitor"]
